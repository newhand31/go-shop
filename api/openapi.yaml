openapi: 3.0.3
info:
  title: go-shop API
  version: 0.7.0
  description: |
    Contract-first: this file is the single source of truth for the HTTP API.
    Run `make api` to regenerate internal/api/api.gen.go.
    Every error response, whatever the status code, has the same shape: the Error schema.
paths:
  /products:
    get:
      operationId: listProducts
      summary: List all products
      responses:
        "200":
          description: All products, ordered by id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /products/{id}:
    get:
      operationId: getProduct
      summary: Get one product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /cart:
    get:
      operationId: getCart
      summary: The current visitor's cart (identified by the session cookie)
      responses:
        "200":
          description: The cart, items ordered by product id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        default:
          $ref: "#/components/responses/Error"
  /cart/items/{productId}:
    put:
      operationId: putCartItem
      summary: Set how many of a product are in the cart (1 to 99)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: The cart after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCartItem
      summary: Remove a product from the cart (removing one that is not there is fine)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The cart after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        default:
          $ref: "#/components/responses/Error"
  /checkout:
    post:
      operationId: checkout
      summary: Buy everything in the cart. Stock is checked and taken in one transaction, so it cannot be oversold.
      responses:
        "201":
          description: The placed order; the cart is now empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Not enough stock for at least one line; nothing was bought and the cart is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Read one order with its status (unpaid, paid or expired)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: There is no such order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /orders/{orderId}/payment:
    post:
      operationId: startPayment
      summary: Start paying an order with ECPay. Answers the signed form the browser must POST to ECPay.
      description: |
        Calling it again for the same unpaid order gives a new form for the same order and amount, so a visitor who closed
        the ECPay tab can come back. Only `MerchantTradeNo` (a new number per attempt, because ECPay does not accept a
        number twice), `MerchantTradeDate` and the signature change. Whichever attempt the visitor pays, the callback
        marks this order paid. A started payment is not recorded: nothing changes until ECPay calls back. An order that is paid or expired cannot be paid: 409 `order_not_payable`.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The form to submit to ECPay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentForm"
        "404":
          description: There is no such order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The order is already paid or has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Any error. The status code says the class, `code` says exactly what.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Product:
      type: object
      required: [id, name, price_twd]
      properties:
        id:
          type: integer
        name:
          type: string
        price_twd:
          type: integer
    CartItemInput:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
    CartItem:
      type: object
      required: [product_id, name, price_twd, quantity]
      properties:
        product_id:
          type: integer
        name:
          type: string
        price_twd:
          type: integer
        quantity:
          type: integer
    Cart:
      type: object
      required: [items, total_twd]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total_twd:
          type: integer
    OrderLine:
      type: object
      required: [product_id, quantity, unit_price_twd]
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
        unit_price_twd:
          type: integer
    Order:
      type: object
      required: [id, total_twd, lines]
      properties:
        id:
          type: integer
        total_twd:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    OrderDetail:
      type: object
      required: [id, total_twd, status, lines]
      properties:
        id:
          type: integer
        total_twd:
          type: integer
        status:
          type: string
          enum: [unpaid, paid, expired]
          description: unpaid holds its stock until paid or expired; expired gave its stock back.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    PaymentForm:
      type: object
      required: [order_id, action_url, method, fields]
      properties:
        order_id:
          type: integer
        action_url:
          type: string
          description: ECPay's checkout address. Submit the form there.
        method:
          type: string
          enum: [POST]
        fields:
          type: object
          additionalProperties:
            type: string
          description: Every field of the form, already signed (CheckMacValue). Send them unchanged.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code. Clients switch on this, never on message.
          example: product_not_found
        message:
          type: string
          description: Human-readable text, safe to show. Never contains internals.
        field:
          type: string
          description: Which input was wrong, when the error is about one.
