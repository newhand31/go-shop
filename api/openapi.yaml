openapi: 3.0.3
info:
  title: go-shop API
  version: 0.3.0
  description: |
    Contract-first: this file is the single source of truth for the HTTP API.
    Run `make api` to regenerate internal/api/api.gen.go.
    Every error response, whatever the status code, has the same shape: the Error schema.
paths:
  /products:
    get:
      operationId: listProducts
      summary: List all products
      responses:
        "200":
          description: All products, ordered by id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /products/{id}:
    get:
      operationId: getProduct
      summary: Get one product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Any error. The status code says the class, `code` says exactly what.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Product:
      type: object
      required: [id, name, price_twd]
      properties:
        id:
          type: integer
        name:
          type: string
        price_twd:
          type: integer
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code. Clients switch on this, never on message.
          example: product_not_found
        message:
          type: string
          description: Human-readable text, safe to show. Never contains internals.
        field:
          type: string
          description: Which input was wrong, when the error is about one.
